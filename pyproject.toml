[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nh-topo"
version = "4.0.0"
description = "Sublattice-symmetry protection of the boundary local density of states in a lossy Su-Schrieffer-Heeger lattice"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Hitesh Kumar Singh" }]
keywords = [
    "non-Hermitian topology",
    "Su-Schrieffer-Heeger model",
    "sublattice symmetry",
    "exceptional point",
    "local density of states",
    "finite-difference frequency-domain",
]
dependencies = [
    "numpy>=1.24,<3.0",
    "scipy>=1.10,<2.0",
    "matplotlib>=3.7,<4.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4.0", "ipykernel>=6.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: full-wave solves; deselect with -m 'not slow'"]

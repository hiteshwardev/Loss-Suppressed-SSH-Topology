[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nh-topo"
version = "2.0.0"
description = "Topological LDOS enhancement in a non-Hermitian (lossy) SSH photonic lattice: a reproducible Python research package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "NH-Topo project" }]
keywords = [
    "non-Hermitian", "topological photonics", "SSH model",
    "local density of states", "exceptional point", "biorthogonal",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0", "nbformat>=5.0", "ipykernel>=6.0"]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

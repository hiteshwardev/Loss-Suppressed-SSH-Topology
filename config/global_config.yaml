# Global project configuration

project:
  name: "Topological LDOS enhancement in a non-Hermitian (lossy) SSH lattice"
  short_name: "NH_Topo_Nanophotonics"
  description: >
    Reproducible Python study of how the topological edge mode of a 1D SSH
    photonic lattice with sublattice-selective loss enhances the local density
    of optical states (LDOS) at the boundary, and of the symmetry conditions
    under which that enhancement is topologically protected against disorder.
  version: "2.0.0"

paths:
  # Relative to the repository root. Only directories that are actually produced
  # by the workflow are listed (no phantom data/log directories).
  config: "config"
  notebooks: "notebooks"
  scripts: "scripts"
  figures: "figures"

execution:
  save_all_figures: true
  random_seed: 42
  floating_point_precision: "float64"

numerics:
  backend: "numpy / scipy"
  dense_eigensolver: "scipy.linalg.eig"       # 2N x 2N dense, full spectrum
  green_function: "scipy.linalg.solve"        # (omega + i*eta - H) x = e_site
  # All results in this project use DENSE linear algebra on small (<= a few
  # hundred) dimensional matrices; no iterative solvers are used, so there is
  # no risk of spectral pollution or non-convergence.

reproducibility:
  # Determinism is achieved by seeding numpy.random.default_rng(seed) for every
  # stochastic (disorder) calculation. See REPRODUCIBILITY.md for the exact
  # environment and a one-command rebuild of every figure.
  deterministic: true
  rebuild_command: "python scripts/generate_all.py"

# Global project configuration

project:
  name: "Topology-Driven Non-Hermitian Nanophotonics"
  short_name: "NH_Topo_Nanophotonics"
  description: >
    Computational research project investigating non-Hermitian topological
    photonic lattices with sublattice-selective loss. Studies how topological
    edge modes in the SSH model enhance the local density of optical states
    (LDOS) at the lattice boundary and the consequences for spontaneous emission
    from quantum emitters.
  version: "1.0.0"

paths:
  root: ".."
  notebooks: "notebooks"
  config: "config"
  data:
    raw: "data/raw"
    processed: "data/processed"
    metadata: "data/metadata"
  results: "results"
  figures: "figures"
  logs: "logs"

execution:
  save_all_figures: true
  overwrite_existing: true
  random_seed: 42
  floating_point_precision: "float64"

numerics:
  backend: "numpy"
  linear_algebra: "scipy.linalg"
  eigensolver: "scipy.linalg.eig"
  tolerance: 1.0e-10

logging:
  enable_logging: true
  log_level: "INFO"
  log_to_file: true
  log_directory: "logs"

reproducibility:
  track_parameters: true
  hash_parameters: true

# Lattice and physical parameters
# Model: Non-Hermitian SSH with sublattice-selective loss on B sites.
#
# Physical note: in the SSH model, t2 > t1 (topological) when the inter-cell
# resonator gap is SMALLER than the intra-cell gap. Closer resonators → stronger
# evanescent coupling. So d_inter < d_intra → t2 > t1 → topological phase.
#
# Loss is applied to the B sublattice only (e.g., absorbing cladding or a
# radiative channel), while A-sublattice resonators remain lossless. Because the
# A-sublattice-dominated topological edge mode has (in the semi-infinite limit)
# strictly zero weight on B sites, it is decoupled from the loss channel and
# remains at Re(E)=0, Im(E)≈0 — see notebooks 01 and 08.

lattice:
  dimension: 1
  lattice_type: "SSH"
  num_unit_cells: 20
  boundary_condition: "open"

geometry:
  lattice_constant: 1.0
  resonator_radius: 0.18
  intra_cell_spacing: 0.6   # d1 / a  (intra-cell gap, larger → weaker t1)
  inter_cell_spacing: 0.4   # d2 / a  (inter-cell gap, smaller → stronger t2)
  refractive_index:
    resonator: 3.45
    background: 1.0

couplings:
  intra_cell: 0.8     # t1 (weaker, intra-cell)
  inter_cell: 1.2     # t2 (stronger, inter-cell)  → t2/t1 = 1.5 > 1 → topological
  coupling_units: "normalized"

non_hermiticity:
  enabled: true
  type: "sublattice_loss"    # loss only on B sublattice
  sublattice_loss:
    sublattice: "B"          # which sublattice carries the loss
    strength: 0.3            # gamma (loss rate, in units of t1)
  # Bulk exceptional point / PT-symmetry breaking threshold.
  # H(k) = [[0, q],[q*, -i*gamma]] has eigenvalues
  #     E(k) = -i*gamma/2 +/- sqrt(|q(k)|^2 - (gamma/2)^2).
  # The radicand is real for all k iff gamma/2 < min_k|q(k)| = |t2 - t1|,
  # i.e. the bulk EP/PT-breaking threshold is
  #     gamma_EP = 2*|t2 - t1| = 0.8   (NOT |t2-t1|).
  # In the unbroken phase BOTH bulk bands share Im(E) = -gamma/2 (they are
  # NOT real-valued; only their real parts are split). With gamma = 0.3 the
  # system is comfortably below gamma_EP = 0.8 (verified in notebook 03/08).

frequency:
  normalization: "coupling"  # omega measured in units of t1
  omega_min: -3.0
  omega_max:  3.0
  num_omega:  800
  eta_broadening: 0.05       # Lorentzian broadening for LDOS (in units of t1)
  # Band structure: bulk bands occupy |Re(E)| in [|t2-t1|, t1+t2] = [0.4, 2.0].
  # The TOPOLOGICAL GAP (Re-part) therefore has half-width |t2-t1| = 0.4.
  # The narrow window below is only the LDOS *integration* window around the
  # edge-mode pole at omega=0; it is deliberately << half-gap so that it sees
  # the edge pole but excludes the bulk band edges.
  gap_half_width: 0.15       # LDOS gap-integration window: |omega| < 0.15 t1
